name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    # The HACS validator refuses private repositories; it runs once this is public.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # Needs repository settings that only exist on a public repo listed
          # in HACS defaults; not required for custom repositories.
          ignore: brands topics description

  tests:
    # 3.13 tests against Home Assistant 2026.2 (the last release for it);
    # 3.14 tests against the newest Home Assistant.
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements_test.txt ruff
      - run: ruff check custom_components tests --select E,F,W,B,UP,I --ignore E501
      - run: pytest -q
